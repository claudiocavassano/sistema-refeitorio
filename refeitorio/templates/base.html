<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Refeitório{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'refeitorio/css/style.css' %}">
</head>
<body>
    <nav class="topbar">
        <div class="nav-inner">
        <a class="brand" href="{% url 'refeitorio:home' %}"><span class="brand-mark"></span>Refeitório
            <img class="logo-if" src="{% static 'refeitorio/images/IF.png' %}" alt="Logo do IF">
        </a>
        <div class="nav">
            <div class="nav-links">
                <a href="{% url 'refeitorio:home' %}">Início</a>
                <a href="{% url 'refeitorio:aluno_list' %}">Alunos</a>
                <a href="{% url 'refeitorio:turma_list' %}">Turmas</a>
            </div>
        </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
