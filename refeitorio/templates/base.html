<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Refeitório{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        nav { background: #1f4e79; padding: 12px 24px; }
        nav a { color: #fff; margin-right: 20px; text-decoration: none; font-weight: bold; }
        main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #e8eef4; }
        .btn { display: inline-block; padding: 6px 12px; background: #1f4e79; color: #fff;
               text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        .btn-danger { background: #b02a2a; }
        .btn-gray { background: #777; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'refeitorio:home' %}">Início</a>
        <a href="{% url 'refeitorio:aluno_list' %}">Alunos</a>
        <a href="{% url 'refeitorio:turma_list' %}">Turmas</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
