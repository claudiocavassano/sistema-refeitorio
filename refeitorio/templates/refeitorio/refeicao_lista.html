{% extends 'base.html' %}
{% block content %}
<h1>Refeições realizadas</h1>
<a class="btn" href="{% url 'refeitorio:refeicao_create' %}">+ Registrar refeição</a>
<table>
    <tr><th>Aluno</th><th>Turma</th><th>Data</th><th>Ações</th></tr>
    {% for r in refeicao_list %}
    <tr>
        <td>{{ r.aluno.nome_aluno }}</td>
        <td>{{ r.aluno.turma }}</td>
        <td>{{ r.data|date:"d/m/Y" }}</td>
        <td><a href="{% url 'refeitorio:refeicao_delete' r.pk %}">Excluir</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="4">Nenhuma refeição registrada.</td></tr>
    {% endfor %}
</table>
{% endblock %}
