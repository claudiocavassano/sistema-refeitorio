{% extends 'base.html' %}
{% block content %}
<h1>Confirmar exclusão</h1>
<p>Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>
{% if object.alunos.exists %}
    <p style="color:#b02a2a;">Atenção: os alunos desta turma também serão excluídos.</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="javascript:history.back()" class="btn btn-gray">Cancelar</a>
</form>
{% endblock %}
